<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRIP League - Dashboard</title>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>

  <body>
    <div class="container">
      <div
        class="admin-header glass-panel"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <img
          src="../../../public/Logo.png"
          alt="GRIP Logo"
          style="height: 60px"
        />
        <button
          class="btn btn-primary"
          onclick="createNewGame()"
          style="padding: 12px 30px; font-size: 1.1rem"
        >
          <span style="font-size: 1.3rem">+</span> Create Game
        </button>
      </div>

      <div style="padding-top: 30px">
        <div id="gamesList" class="games-grid"></div>

        <div
          id="noGames"
          style="
            display: none;
            text-align: center;
            color: var(--text-muted);
            padding: 80px;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 20px;
            border: 1px dashed var(--border-color);
          "
        >
          <div style="font-size: 4rem; margin-bottom: 20px; opacity: 0.5">
            🎮
          </div>
          <p style="font-size: 1.2rem; color: var(--text-main)">
            No games created yet.
          </p>
          <p style="margin-top: 10px; font-size: 0.9rem">
            Click "Create Game" to get started!
          </p>
        </div>
      </div>
    </div>

    <script>
      const { ipcRenderer } = require("electron");

      async function loadGames() {
        const games = await ipcRenderer.invoke("get-all-games");
        const gamesList = document.getElementById("gamesList");
        const noGames = document.getElementById("noGames");

        if (games.length === 0) {
          gamesList.innerHTML = "";
          noGames.style.display = "block";
          return;
        }

        noGames.style.display = "none";
        gamesList.innerHTML = games
          .map(
            (game, index) => `
        <div class="game-card glass-panel fade-in" style="animation-delay: ${
          index * 0.1
        }s">
          <div style="display: flex; justify-content: space-between; align-items: start;">
            <span class="game-type ${game.gameType.toLowerCase()}">${
              game.gameType
            }</span>
            <span style="font-size: 0.8rem; color: var(--text-muted); background: rgba(0,0,0,0.05); padding: 4px 8px; border-radius: 8px;">
              ${new Date(game.dateCreated).toLocaleDateString()}
            </span>
          </div>

          <h3>${game.title}</h3>

          <div class="game-info">
            <p><span>Teams</span> <strong>${game.numberOfTeams}</strong></p>
            <p><span>R1 Questions</span> <strong>${
              game.round1Questions.length
            }</strong></p>
            <p><span>R2 Questions</span> <strong>${
              game.round2Questions.length
            }</strong></p>
          </div>

          <div class="game-actions">
            <button class="btn btn-success" onclick="playGame('${
              game.id
            }')" title="Play Game">
              ▶ Play
            </button>
            <button class="btn btn-secondary" onclick="editGame('${
              game.id
            }')" title="Edit Game">
              ✎ Edit
            </button>
            <button class="btn btn-danger" onclick="deleteGame('${
              game.id
            }')" title="Delete Game">
              Delete
            </button>
          </div>
        </div>
      `
          )
          .join("");
      }

      function createNewGame() {
        window.location.href = "create-game.html";
      }

      function playGame(gameId) {
        ipcRenderer.send("open-game-window", gameId);
      }

      function editGame(gameId) {
        window.location.href = `create-game.html?id=${gameId}`;
      }

      async function deleteGame(gameId) {
        if (
          confirm(
            "Are you sure you want to delete this game? This action cannot be undone."
          )
        ) {
          await ipcRenderer.invoke("delete-game", gameId);
          loadGames();
        }
      }

      // Load games on page load
      loadGames();
    </script>
  </body>
</html>
