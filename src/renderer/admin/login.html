<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRIP League - Admin Login</title>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <style>
      /* Sky Blue Light Login Theme */
      body {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        font-family: "Inter", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: #0f172a;
      }

      .login-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(14, 165, 233, 0.05) 0%,
          transparent 60%
        );
      }

      .login-box {
        width: 100%;
        max-width: 420px;
        padding: 50px 40px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 32px;
        box-shadow: 0 20px 40px -10px rgba(14, 165, 233, 0.15);
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .login-box:hover {
        transform: translateY(-5px);
        box-shadow: 0 30px 60px -15px rgba(14, 165, 233, 0.25);
      }

      .login-logo {
        filter: drop-shadow(0 10px 20px rgba(14, 165, 233, 0.15));
        transition: filter 0.3s ease;
        margin-bottom: 20px !important;
      }

      .login-logo:hover {
        filter: drop-shadow(0 15px 25px rgba(14, 165, 233, 0.25));
      }

      h2 {
        color: #0284c7 !important; /* Sky 600 */
        font-size: 1rem !important;
        font-weight: 700 !important;
        letter-spacing: 0.15em !important;
        margin-bottom: 40px !important;
        text-transform: uppercase;
      }

      input {
        background: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        color: #0f172a !important;
        padding: 16px 20px !important;
        border-radius: 16px !important;
        font-size: 1.1rem !important;
        margin-bottom: 20px;
        transition: all 0.3s ease;
      }

      input:focus {
        background: white !important;
        border-color: #0ea5e9 !important;
        box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15) !important;
        transform: scale(1.02);
        outline: none;
      }

      input::placeholder {
        color: #94a3b8;
      }

      .btn-primary {
        background: #0ea5e9 !important; /* Sky 500 */
        color: white !important;
        font-weight: 700 !important;
        padding: 16px !important;
        border-radius: 16px !important;
        font-size: 1.1rem !important;
        letter-spacing: 0.02em;
        border: none;
        transition: all 0.2s ease;
        margin-top: 10px;
        box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4);
      }

      .btn-primary:hover:not(:disabled) {
        background: #0284c7 !important; /* Sky 600 */
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(14, 165, 233, 0.5) !important;
      }

      .btn-primary:disabled {
        opacity: 0.7;
        cursor: wait;
        background: #cbd5e1 !important;
      }

      .error-message {
        background: #fef2f2 !important;
        border: 1px solid #fecaca;
        color: #ef4444 !important;
        border-radius: 12px !important;
        margin-top: 20px !important;
        padding: 12px !important;
        font-weight: 500;
        display: none;
      }

      /* Override main.css container if needed */
      .login-container {
        background: transparent !important;
      }
    </style>

    <div class="login-container">
      <div class="login-box">
        <img
          src="../../../public/Logo.png"
          alt="GRIP League Logo"
          class="login-logo"
          style="max-width: 500px; width: 100%; margin-bottom: 30px"
        />
        <h2>Admin Access</h2>

        <form id="loginForm">
          <div class="form-group">
            <input
              type="password"
              id="passwordInput"
              placeholder="Enter Password"
              required
              autofocus
            />
          </div>
          <div class="error-message" id="errorMessage"></div>
          <button type="submit" class="btn btn-primary" style="width: 100%">
            Login
          </button>
        </form>

        <div
          style="
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.5px;
          "
        >
          Developed By
          <span style="color: #0ea5e9; font-weight: 600"
            >Muhammad Rayyan</span
          >
        </div>
      </div>
    </div>

    <script>
      const { ipcRenderer } = require("electron");

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const passwordInput = document.getElementById("passwordInput");
          const errorMessage = document.getElementById("errorMessage");
          const submitBtn = e.target.querySelector('button[type="submit"]');

          // Reset state
          errorMessage.textContent = "";
          errorMessage.style.display = "none";

          // Loading state
          const originalBtnText = submitBtn.textContent;
          submitBtn.textContent = "Verifying...";
          submitBtn.disabled = true;

          try {
            const isValid = await ipcRenderer.invoke(
              "verify-password",
              passwordInput.value
            );

            if (isValid) {
              submitBtn.textContent = "Access Granted";
              submitBtn.style.background = "#22C55E"; // Success Green
              submitBtn.style.color = "white";

              setTimeout(() => {
                window.location.href = "dashboard.html";
              }, 600);
            } else {
              errorMessage.textContent = "Invalid password";
              errorMessage.style.display = "block";
              passwordInput.value = "";
              passwordInput.focus();

              // Shake animation
              const loginBox = document.querySelector(".login-box");
              loginBox.style.animation = "none";
              loginBox.offsetHeight; /* trigger reflow */
              loginBox.style.animation =
                "shake 0.4s cubic-bezier(.36,.07,.19,.97) both";

              submitBtn.textContent = originalBtnText;
              submitBtn.disabled = false;
            }
          } catch (error) {
            console.error(error);
            errorMessage.textContent = "Authentication Error";
            errorMessage.style.display = "block";
            submitBtn.textContent = originalBtnText;
            submitBtn.disabled = false;
          }
        });

      const styleSheet = document.createElement("style");
      styleSheet.innerText = `
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }
    `;
      document.head.appendChild(styleSheet);
    </script>
  </body>
</html>
